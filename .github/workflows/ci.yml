# Lint, tests and a Docker build on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Test
        run: python -m pytest -q

  image:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -f deploy/Dockerfile -t insidertrack-mcp:ci .
      - name: Smoke
        run: |
          docker run -d --name mcp -p 8100:8100 -e MCP_TOKENS=ci:test insidertrack-mcp:ci
          for i in $(seq 1 20); do curl -fs http://localhost:8100/mcp/health && break; sleep 1; done
          curl -fs http://localhost:8100/mcp/health | grep -q '"status":"ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8100/mcp)" = 401
