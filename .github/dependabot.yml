# Weekly grouped updates for the Python package, monthly for the base image
# and Actions. Patch/minor bumps auto-merge once CI is green (see
# dependabot-auto-merge.yml); majors and the base image wait for a person.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      python-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 3
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: monthly
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
